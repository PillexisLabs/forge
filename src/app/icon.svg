<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Forge logomark, brand palette.
    Tile: Primary 900 (#B9444C) to Primary 700 (#90353B), top left to bottom right.
    F stem and upper arm: white. Lower arm: Primary 300 tint (#E8C1C3).
    Corner radius 180 on a 1024 grid.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9444C"/>
      <stop offset="1" stop-color="#90353B"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="180" fill="url(#bg)"/>
  <rect x="380" y="506" width="270" height="132" rx="22" fill="#E8C1C3"/>
  <rect x="330" y="292" width="132" height="480" rx="22" fill="#FFFFFF"/>
  <rect x="330" y="292" width="386" height="132" rx="22" fill="#FFFFFF"/>
</svg>
